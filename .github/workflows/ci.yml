name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A stale run on an updated PR branch has nothing left to report on; cancel it
# instead of burning minutes on a result nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          cd backend
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: cd backend && go build ./...

      - name: vet
        run: cd backend && go vet ./...

      - name: test
        run: cd backend && go test -race ./...

      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          working-directory: backend

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: seed env
        run: cp deploy/compose/.env.example deploy/compose/.env

      - name: bring up the stack
        run: make up

      - name: healthy stack answers 200
        run: |
          body=$(curl -sf http://localhost:8080/healthz)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: unknown path answers 404
        run: |
          status=$(curl -s -o /tmp/body.json -w '%{http_code}' http://localhost:8080/v1/nope)
          cat /tmp/body.json
          test "$status" = "404"
          grep -q '"code":"not_found"' /tmp/body.json

      - name: migrations applied — the 11 core tables exist
        run: |
          count=$(docker compose -f deploy/compose/docker-compose.yml exec -T postgres sh -c "
            PGPASSWORD=\"\$PORYGON_ETL_PASSWORD\" psql -qtAX -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U porygon_etl -d \"\$POSTGRES_DB\" \
              -c \"SELECT count(*) FROM information_schema.tables
                    WHERE table_schema = 'public' AND table_name IN (
                      'data_set','generation','type','stat','nature','species',
                      'move','move_meta','move_stat_change','ability','item')\"
          " | tr -d '\r')
          echo "core tables present: $count"
          test "$count" = "11"

      - name: etl role writes a core reference table (AD-6)
        run: |
          docker compose -f deploy/compose/docker-compose.yml exec -T postgres sh -c "
            PGPASSWORD=\"\$PORYGON_ETL_PASSWORD\" psql -qtAX -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U porygon_etl -d \"\$POSTGRES_DB\" \
              -c \"INSERT INTO data_set (identifier) VALUES ('ad6-probe')\" \
              -c \"DELETE FROM data_set WHERE identifier = 'ad6-probe'\"
          "

      - name: app role is rejected writing a core reference table (AD-6)
        run: |
          # Without the read, a broken connection would pass as a rejection.
          docker compose -f deploy/compose/docker-compose.yml exec -T postgres sh -c "
            PGPASSWORD=\"\$PORYGON_APP_PASSWORD\" psql -qtAX -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U porygon_app -d \"\$POSTGRES_DB\" \
              -c \"SELECT count(*) FROM data_set\"
          "
          set +e
          out=$(docker compose -f deploy/compose/docker-compose.yml exec -T postgres sh -c "
            PGPASSWORD=\"\$PORYGON_APP_PASSWORD\" psql -qtAX -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U porygon_app -d \"\$POSTGRES_DB\" \
              -c \"INSERT INTO data_set (identifier) VALUES ('ad6-violation')\"
          " 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'permission denied for table data_set'

      - name: etl loads the pinned dump (AD-14)
        run: make etl

      - name: etl is idempotent on natural key
        run: make etl

      - name: loaded data is queryable by the read-only app role
        run: |
          query() {
            docker compose -f deploy/compose/docker-compose.yml exec -T postgres sh -c "
              PGPASSWORD=\"\$PORYGON_APP_PASSWORD\" psql -qtAX -v ON_ERROR_STOP=1 \
                -h 127.0.0.1 -U porygon_app -d \"\$POSTGRES_DB\" -c \"$1\"
            " | tr -d '\r'
          }
          # Exact counts pin the dump: a re-pin that shifts them fails here.
          species=$(query "SELECT count(*) FROM species")
          moves=$(query "SELECT count(*) FROM move")
          echo "species=$species moves=$moves"
          test "$species" = "1351"
          test "$moves" = "919"

          # FR1's structured effect query, not a text match.
          hit=$(query "SELECT m.identifier FROM move_stat_change msc
                         JOIN move m ON m.id = msc.move_id
                         JOIN stat s ON s.id = msc.stat_id
                        WHERE s.identifier = 'attack' AND msc.change = 2
                          AND m.identifier = 'swords-dance'")
          test "$hit" = "swords-dance"

      - name: pokedex live-database tests
        run: |
          set -a
          . deploy/compose/.env
          set +a
          export TEST_DATABASE_URL="postgres://porygon_app:${PORYGON_APP_PASSWORD}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?sslmode=disable"
          cd backend && go test -race -cover ./internal/pokedex/...

      - name: structured effect search over /v1 (Story 1.3)
        run: |
          body=$(curl -sf 'http://localhost:8080/v1/moves/search?effect=stat:attack:2')
          echo "$body"
          test "$(echo "$body" | jq -r '.count')" = "7"
          echo "$body" | jq -e '.results[] | select(.identifier == "swords-dance") | .effect.stat_changes[] | select(.stat == "attack" and .change == 2)' >/dev/null
          status=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/v1/moves/search?effect=stat:atk:2')
          test "$status" = "400"

      - name: postgres down answers 503, api stays up
        run: |
          docker compose -f deploy/compose/docker-compose.yml stop postgres
          # The compose healthcheck needs a few failed probes to flip the
          # container unhealthy; /healthz itself reflects the ping instantly,
          # so poll it rather than the container health state.
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz)
            [ "$status" = "503" ] && break
            sleep 1
          done
          test "$status" = "503"
          docker compose -f deploy/compose/docker-compose.yml ps api --format '{{.State}}' | grep -q running

      - name: compose logs
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml logs

      - name: tear down
        if: always()
        run: make down
