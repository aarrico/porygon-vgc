name: porygon-vgc

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/compose/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/compose/.env}
      PORYGON_ETL_PASSWORD: ${PORYGON_ETL_PASSWORD:?set PORYGON_ETL_PASSWORD in deploy/compose/.env}
      PORYGON_APP_PASSWORD: ${PORYGON_APP_PASSWORD:?set PORYGON_APP_PASSWORD in deploy/compose/.env}
      PORYGON_BATCH_PASSWORD: ${PORYGON_BATCH_PASSWORD:?set PORYGON_BATCH_PASSWORD in deploy/compose/.env}
      PORYGON_ANALYTICS_PASSWORD: ${PORYGON_ANALYTICS_PASSWORD:?set PORYGON_ANALYTICS_PASSWORD in deploy/compose/.env}
    ports:
      # Loopback only: the .env.example credentials are throwaway and must not
      # be reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ images want the mount one level up from data/ so the
      # major-version subdirectory lives inside the volume.
      - postgres-data:/var/lib/postgresql
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1
    command:
      - "-path=/migrations"
      - "-database=${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL in deploy/compose/.env}"
      - "up"
    volumes:
      - ../../backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Profile-gated: a load is deliberate, never part of bringing the stack up.
  etl:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: etl
    environment:
      DATABASE_URL: ${ETL_DATABASE_URL:?set ETL_DATABASE_URL in deploy/compose/.env}
      DATA_SET: ${DATA_SET:-gen-9}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    profiles: ["etl"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/compose/.env}
      # Container-internal bind is fixed so the healthcheck below stays valid;
      # the host-side port is API_PORT.
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    # Above the binary's 10s shutdownTimeout: at exactly 10s Docker would
    # SIGKILL a drain that used its full budget.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
