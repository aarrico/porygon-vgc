repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (backend)
        entry: bash -c 'cd backend && golangci-lint run --new-from-rev HEAD --fix'
        language: golang
        additional_dependencies: ["github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2"]
        pass_filenames: false
        files: ^backend/.*\.go$
