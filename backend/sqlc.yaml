version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/pokedex/queries"
    schema: "migrations/000001_core_reference_schema.up.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/pokedex/internal/sqlcgen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: false
        emit_interface: true
